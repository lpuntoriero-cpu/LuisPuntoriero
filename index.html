
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drift Masters</title>
  <meta name="theme-color" content="#00e676">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #121212;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #00e676;
      margin-bottom: 5px;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    .status-card {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff5252;
    }

    .status-text.connected {
      color: #00e676;
    }

    .btn {
      background: #2c2c2c;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      max-width: 350px;
      margin-bottom: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-connect {
      background: #00e676;
      color: #000;
    }

    .btn-largada2 {
      background: #29b6f6;
      color: #000;
    }

    .btn-largada1 {
      background: #ab47bc;
      color: white;
    }

    .btn-reset {
      background: #ff5252;
      color: white;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .console {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      max-width: 350px;
      height: 260px;
      overflow-y: auto;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-align: left;
      font-size: 0.75rem;
      border: 1px solid #333;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <h1>DRIFT MASTERS</h1>
  <p class="subtitle">Control de Pista Micro:bit</p>

  <div class="status-card">
    Estado:
    <span id="lblEstado" class="status-text">Desconectado</span>
  </div>

  <button id="btnConectar" class="btn btn-connect"
          onclick="conectarBLE()">
    Buscar Pista Bluetooth
  </button>

  <button id="btnLargada2" class="btn btn-largada2"
          onclick="enviarComando('A')" disabled>
    Largar 2 Autos (A)
  </button>

  <button id="btnLargada1" class="btn btn-largada1"
          onclick="enviarComando('S')" disabled>
    Largar 1 Auto (S)
  </button>

  <button id="btnReset" class="btn btn-reset"
          onclick="enviarComando('B')" disabled>
    RESET / Arcoíris (B)
  </button>

  <div id="console" class="console">> Listo para conectar...</div>

  <script>
    const UART_SERVICE_UUID =
      "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

    let dispositivo = null;
    let gattServer = null;
    let txCharacteristic = null;

    let colaEnvio = [];
    let enviando = false;

    function log(mensaje) {
      const consola = document.getElementById("console");
      consola.textContent += "\n> " + mensaje;
      consola.scrollTop = consola.scrollHeight;
    }

    function actualizarEstado(conectado) {
      const estado = document.getElementById("lblEstado");

      estado.textContent = conectado
        ? "Conectado"
        : "Desconectado";

      estado.classList.toggle("connected", conectado);

      document.getElementById("btnLargada2").disabled = !conectado;
      document.getElementById("btnLargada1").disabled = !conectado;
      document.getElementById("btnReset").disabled = !conectado;
    }

    async function conectarBLE() {
      if (!navigator.bluetooth) {
        log("ERROR: Web Bluetooth no está disponible.");
        log("Usá Chrome o Edge mediante HTTPS.");
        return;
      }

      try {
        document.getElementById("btnConectar").disabled = true;

        log("Buscando micro:bit...");

        dispositivo = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "BBC micro:bit" }],
          optionalServices: [UART_SERVICE_UUID]
        });

        dispositivo.removeEventListener(
          "gattserverdisconnected",
          onDisconnected
        );

        dispositivo.addEventListener(
          "gattserverdisconnected",
          onDisconnected
        );

        log("Dispositivo: " + dispositivo.name);
        log("Conectando...");

        gattServer = await dispositivo.gatt.connect();

        log("Buscando servicio UART...");

        const servicio = await gattServer.getPrimaryService(
          UART_SERVICE_UUID
        );

        const caracteristicas = await servicio.getCharacteristics();

        log("--- DIAGNÓSTICO UART ---");

        for (const c of caracteristicas) {
          const p = c.properties;

          log("UUID: " + c.uuid);
          log("  write: " + p.write);
          log("  writeWithoutResponse: " + p.writeWithoutResponse);
          log("  notify: " + p.notify);
          log("  indicate: " + p.indicate);
          log("  read: " + p.read);
        }

        log("--- FIN DIAGNÓSTICO ---");

        // Seleccionar la característica que realmente permita escribir.
        txCharacteristic = caracteristicas.find(c =>
          c.properties.write || c.properties.writeWithoutResponse
        );

        if (!txCharacteristic) {
          throw new Error(
            "No se encontró una característica UART que permita escribir."
          );
        }

        log("Característica seleccionada: " + txCharacteristic.uuid);
        log("write = " + txCharacteristic.properties.write);
        log(
          "writeWithoutResponse = " +
          txCharacteristic.properties.writeWithoutResponse
        );

        colaEnvio = [];
        enviando = false;

        actualizarEstado(true);
        log("Conexión establecida.");

      } catch (error) {
        txCharacteristic = null;
        gattServer = null;

        actualizarEstado(false);

        log("ERROR al conectar: " + error.name + " - " + error.message);

      } finally {
        document.getElementById("btnConectar").disabled = false;
      }
    }

    function enviarComando(cmd) {
      if (
        !txCharacteristic ||
        !gattServer ||
        !gattServer.connected
      ) {
        log("No hay conexión Bluetooth activa.");
        return;
      }

      colaEnvio.push(cmd);
      procesarFila();
    }

    async function procesarFila() {
      if (enviando || colaEnvio.length === 0) {
        return;
      }

      enviando = true;

      const cmd = colaEnvio.shift();

      try {
        if (
          !txCharacteristic ||
          !gattServer ||
          !gattServer.connected
        ) {
          throw new Error("Conexión GATT inactiva.");
        }

        // Enviamos la letra y un salto de línea.
        const datos = new TextEncoder().encode(cmd + "\n");
        const propiedades = txCharacteristic.properties;

        if (propiedades.writeWithoutResponse) {
          await txCharacteristic.writeValueWithoutResponse(datos);
        } else if (propiedades.write) {
          await txCharacteristic.writeValueWithResponse(datos);
        } else {
          throw new Error(
            "La característica seleccionada no permite escritura."
          );
        }

        log("Comando enviado: " + cmd);

      } catch (error) {
        log("ERROR GATT: " + error.name + " - " + error.message);

      } finally {
        setTimeout(() => {
          enviando = false;

          if (colaEnvio.length > 0) {
            procesarFila();
          }
        }, 250);
      }
    }

    function onDisconnected() {
      txCharacteristic = null;
      gattServer = null;
      colaEnvio = [];
      enviando = false;

      actualizarEstado(false);

      log("Micro:bit desconectada.");
    }
  </script>
</body>
</html>
