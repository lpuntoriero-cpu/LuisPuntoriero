<style>

<label>Rojo V1<input type="number" min=".01" step=".001" id="r1" value="7.8"></label><label>Rojo total<input type="number" min=".01" step=".001" id="rt" value="14.9"></label></div>

<script type="module">
import {paths,routeFor,validateTrack} from './core.mjs';

const $=id=>document.getElementById(id);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1621);scene.fog=new THREE.Fog(0x0b1621,900,1950);
const canvas=$('view');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});

const sun=new THREE.DirectionalLight(0xffeed7,3.1);sun.position.set(-240,470,310);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-800;sun.shadow.camera.right=800;sun.shadow.camera.top=700;sun.shadow.camera.bottom=-700;sun.shadow.camera.near=20;sun.shadow.camera.far=1200;sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;scene.add(sun);
const fill=new THREE.DirectionalLight(0x6ca7ff,1.1);fill.position.set(400,240,-100);scene.add(fill);
function tx(base,grains){const c=document.createElement('canvas');c.width=c.height=256;const q=c.getContext('2d');q.fillStyle=base;q.fillRect(0,0,256,256);let n=101;for(let i=0;i<grains;i++){n=(Math.imul(n,1664525)+1013904223)>>>0;const x=n%256;n=(Math.imul(n,1664525)+1013904223)>>>0;const y=n%256;const z=(n>>9)&31;q.fillStyle=i%3?'rgba(226,237,243,.065)':'rgba(0,0,0,.15)';q.fillRect(x,y,1+z%2,1+z%2)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}
const asphalt=tx('#343a3d',12500),grass=tx('#24472b',16000);grass.repeat.set(8,5);

const grassmat=new THREE.MeshStandardMaterial({map:grass,roughness:1});
const table=new THREE.Mesh(new THREE.BoxGeometry(1290,16,770),new THREE.MeshStandardMaterial({color:0x4a483a,roughness:1}));table.position.set(535,-15,-300);table.receiveShadow=true;scene.add(table);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1250,730),grassmat);ground.rotation.x=-Math.PI/2;ground.position.set(535,-6,-300);ground.receiveShadow=true;scene.add(ground);
const red=new THREE.MeshStandardMaterial({color:0xf02545,roughness:.75}),white=new THREE.MeshStandardMaterial({color:0xe9e9e5,roughness:.8});
const silver=new THREE.MeshStandardMaterial({color:0x858b95,metalness:.55,roughness:.45});
const concrete=new THREE.MeshStandardMaterial({color:0x555d66,roughness:.95});
function vec(p,dy=0){return new THREE.Vector3(p[0],p[2]*.38+dy,-p[1])}
function tangent(path,i){const a=path.points[Math.max(0,i-1)],b=path.points[Math.min(path.points.length-1,i+1)];return new THREE.Vector3(b[0]-a[0],0,-(b[1]-a[1])).normalize()}

// Detectar pianos coincidentes en los dos recorridos, conservando solo el primero.
// Un solo piano por borde visible: eliminar trazos de la pista que quedan
// dentro del asfalto del otro recorrido, siempre a la misma altura.
// Bordes compartidos: topología explícita, NO filtros ni borrados por proximidad.
// Un solo piano rojo/blanco une ambos carriles a través de la recta central.
// En la curva izquierda conservamos el borde interior del túnel; en la derecha también.
const CURB_HALF_ROAD=27.75,CURB_EXTRA=5.25,CURB_Y=1.62;
const INLEFT_END=24,INRIGHT_START=(paths.tunnel.points.length-1)-24; // Puntos exactos de la recta

const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function nearestTunneledEdge(pos,side){
 const path=paths.tunnel;let best=Infinity,closest=null;
 for(let k=0;k<path.points.length;k++){
  if(path.points[k][2]>1)continue;
  const c=edge(path,k,side*30.375,CURB_Y),d=(c.x-pos.x)**2+(c.z-pos.z)**2;
  if(d<best){best=d;closest=c;}
 }

}
// Devuelve los dos vértices del piano para una sola estación de la curva.
function curbStation(path,side,i){
 const a=edge(path,i,side*CURB_HALF_ROAD,CURB_Y);
 const b=edge(path,i,side*(CURB_HALF_ROAD+CURB_EXTRA),CURB_Y);
 // Unir el piano central de la recta con la curva, sin corte ni doble línea.
 if(path===paths.tunnel&&side===-1&&i>=INLEFT_END&&i<=INLEFT_END+24){
  const f=1-smooth((i-INLEFT_END)/24);
  const center=a.clone().add(b).multiplyScalar(.5);
  const shift=new THREE.Vector3(280-center.x,0,-500-center.z).multiplyScalar(f);
  a.add(shift);b.add(shift);
 }
 if(path===paths.tunnel&&side===1&&i>=INRIGHT_START-24&&i<=INRIGHT_START){
  const f=smooth((i-(INRIGHT_START-24))/24);
  const center=a.clone().add(b).multiplyScalar(.5);
  const shift=new THREE.Vector3(850-center.x,0,-500-center.z).multiplyScalar(f);
  a.add(shift);b.add(shift);
 }
 // El borde independiente nace del compartido en la curva izquierda.
 if(path===paths.bridge&&side===1&&i>=BRIDGE_LEFT_SPLIT&&i<=BRIDGE_LEFT_SPLIT+48){
  const f=1-smooth((i-BRIDGE_LEFT_SPLIT)/48);
  const center=a.clone().add(b).multiplyScalar(.5);
  const closest=nearestTunneledEdge(center,-1);
  if(closest){const shift=closest.sub(center).multiplyScalar(f);a.add(shift);b.add(shift);}
 }

 if(path===paths.bridge&&side===-1&&i>=BRIDGE_RIGHT_JOIN-24&&i<=BRIDGE_RIGHT_JOIN){
  const f=smooth((i-(BRIDGE_RIGHT_JOIN-24))/24);
  const center=a.clone().add(b).multiplyScalar(.5);
  const closest=nearestTunneledEdge(center,1);
  if(closest){const shift=closest.sub(center).multiplyScalar(f);a.add(shift);b.add(shift);}

}
function visibleCurbSegment(path,side,i){
 if(path===paths.tunnel){
  if(side===-1&&i<INLEFT_END)return false;
  if(side===1&&i>=INRIGHT_START)return false;
 }else{
  if(side===1&&i<BRIDGE_LEFT_SPLIT)return false;
  if(side===-1&&i>=BRIDGE_RIGHT_JOIN)return false;

}
// Dos lotes geométricos únicos (rojo/blanco) evitan miles de draw calls y
// hacen que cada tramo consecutivo tenga una posición estable en pantalla.
const curbMeshes=new Map([[red,{coords:[],indices:[]}],[white,{coords:[],indices:[]}]]);
function paintCurbSegment(a,b,c,d,material){
 const batch=curbMeshes.get(material),offset=batch.coords.length/3;

function finalizeCurbs(){
 for(const [mat,batch] of curbMeshes){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(batch.coords,3));
  g.setIndex(batch.indices);g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,mat);
  mesh.material.side=THREE.DoubleSide;
  mesh.receiveShadow=false;mesh.castShadow=false;mesh.renderOrder=5;

}
function buildCurb(path){
 for(const side of[-1,1]){
  for(let i=0;i<path.points.length-1;i++){
   if(!visibleCurbSegment(path,side,i))continue;

}
function strip(path){
 const road=new THREE.Mesh(ribbon(path,55.5,path===paths.bridge?1.19:1.15),roadmat);

 buildCurb(path);
}
strip(paths.tunnel);strip(paths.bridge);
// ÚNICO piano central. Las cuatro piezas interiores de ambas rectas
// se omiten del trazado individual y se reemplazan por este borde continuo.
for(let x=280,k=0;x<850;x+=24,k++){
 const x1=Math.min(850,x+24);
 const mat=k%2===0?red:white;
 paintCurbSegment(
  new THREE.Vector3(x,CURB_Y,-500+CURB_EXTRA/2),
  new THREE.Vector3(x,CURB_Y,-500-CURB_EXTRA/2),
  new THREE.Vector3(x1,CURB_Y,-500+CURB_EXTRA/2),
  new THREE.Vector3(x1,CURB_Y,-500-CURB_EXTRA/2),mat
 );
}
finalizeCurbs();
// Pilar y barandas: solamente en el tramo elevado, dejando el túnel libre.
const elevated=paths.bridge.points.map((p,i)=>({p,i})).filter(x=>x.p[2]>25);
// Tablero continuo debajo del asfalto: superficie superior a +1.15, soporte a -3.2.
const bridgeDeck=new THREE.Mesh(ribbon(paths.bridge,64.5,-3.2),concrete);
bridgeDeck.material.side=THREE.DoubleSide;
bridgeDeck.castShadow=true;bridgeDeck.receiveShadow=true;scene.add(bridgeDeck);
// Dos vigas longitudinales bajo los bordes del tablero; nunca sobresalen del asfalto.
for(const side of[-1,1]){
 const railLine=elevated.filter((_,k)=>k%4===0).map(({i})=>edge(paths.bridge,i,side*27,-5.7));
 if(railLine.length>2){
  const railCurve=new THREE.CatmullRomCurve3(railLine);
  const support=new THREE.Mesh(new THREE.TubeGeometry(railCurve,Math.max(24,railLine.length*3),2.2,8,false),concrete);
  support.castShadow=true;support.receiveShadow=true;scene.add(support);
 }
}
// Dos pórticos simétricos, vigas transversales ABAJO del tablero y cuatro columnas.
for(const fraction of [.18,.82]){
 const idx=elevated[Math.round((elevated.length-1)*fraction)].i;
 const ends=[edge(paths.bridge,idx,-31.5,-5.3),edge(paths.bridge,idx,31.5,-5.3)];
 const bottom=-6;
 const top=Math.min(ends[0].y,ends[1].y)-1.1;
 for(const q of ends){
  const h=Math.max(2,top-bottom);
  const pillar=new THREE.Mesh(new THREE.BoxGeometry(6,h,6),concrete);
  pillar.position.set(q.x,bottom+h/2,q.z);
  pillar.castShadow=true;pillar.receiveShadow=true;scene.add(pillar);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(9,2,9),silver);
  cap.position.set(q.x,top+.5,q.z);cap.castShadow=true;scene.add(cap);
 }

}
for(const side of[-1,1]){const vertices=[];for(const {i} of elevated.filter((_,k)=>k%5===0))vertices.push(edge(paths.bridge,i,side*30,7));const curve=new THREE.CatmullRomCurve3(vertices);const rail=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(16,vertices.length*3),1.3,6,false),silver);rail.castShadow=true;scene.add(rail)}
// Línea de largada/meta horizontal a ambos carriles.
for(let col=0;col<12;col++)for(let row=0;row<2;row++){const m=new THREE.Mesh(new THREE.PlaneGeometry(4.4,4.4),((row+col)%2===0?white:concrete));m.rotation.x=-Math.PI/2;m.position.set(560+row*4.4,1.05,-452-col*8.2);scene.add(m)}
function carModel(id){const root=new THREE.Group();const paint=new THREE.MeshPhysicalMaterial({color:id===0?0x0789f9:0xed2146,metalness:.42,roughness:.23,clearcoat:1,clearcoatRoughness:.13});const dark=new THREE.MeshStandardMaterial({color:0x111c2d,metalness:.3,roughness:.23});const lights=new THREE.MeshBasicMaterial({color:0xfff9df});const tail=new THREE.MeshBasicMaterial({color:0xff344e});
const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;root.add(o);return o};
add(new THREE.BoxGeometry(17,5,30),paint,0,5,0);
add(new THREE.BoxGeometry(14,5,13),dark,0,10,-1.5);
add(new THREE.BoxGeometry(15,1,5),paint,0,8,12);
add(new THREE.BoxGeometry(17,1,3),dark,0,10,-13);
for(const sx of[-1,1]){for(const sz of[-9,10]){const tire=add(new THREE.CylinderGeometry(4,4,3.3,16),dark,sx*9,4,sz);tire.rotation.z=Math.PI/2;const hub=add(new THREE.CylinderGeometry(2.1,2.1,3.6,12),silver,sx*9,4,sz);hub.rotation.z=Math.PI/2}add(new THREE.BoxGeometry(3,.9,1),lights,sx*5,6,15.2);add(new THREE.BoxGeometry(3,.9,1),tail,sx*5,6,-15.2)}
return root}
const cars=[carModel(0),carModel(1)];cars.forEach(c=>scene.add(c));
function setCar(id,d){const {lap,path,dist}=d;const p=path.at(dist),pos=new THREE.Vector3(p.x,p.z*.38+2.2,-p.y);cars[id].position.copy(pos);const pAhead=path.at(Math.min(path.length,dist+3));cars[id].rotation.y=Math.atan2(pAhead.x-p.x,-(pAhead.y-p.y))}
let cameraMode='overview',playing=false,elapsed=0,speed=1,maxTime=15,previous=performance.now();
const initial=new URLSearchParams(location.search);for(const [k,param] of [['b1','b1'],['bt','bt'],['r1','r1'],['rt','rt']]){const n=Number(initial.get(param));if(initial.has(param)&&Number.isFinite(n)&&n>0)$(k).value=n.toFixed(3)}
function times(){const a=['b1','bt','r1','rt'].map(id=>Number($(id).value));if(a.some(x=>!Number.isFinite(x)||x<=0)||a[1]<=a[0]||a[3]<=a[2])return null;return [[a[0],a[1]],[a[2],a[3]]]}
function sample(id,t,T){const a=T[id],l=t<a[0]?0:1,entry=l?a[0]:0,duration=l?a[1]-a[0]:a[0];const path=routeFor(id,l),frac=Math.max(0,Math.min(1,(t-entry)/duration));return{lap:l,path,dist:frac*path.length,frac}}

function update(){const T=times();if(!T){$('notice').hidden=false;$('notice').textContent='Ingresá tiempos válidos: el total debe superar a la vuelta 1 de cada auto.';playing=false;return}$('notice').hidden=true;maxTime=Math.max(T[0][1],T[1][1]);elapsed=Math.min(elapsed,maxTime);
const data=[sample(0,elapsed,T),sample(1,elapsed,T)];data.forEach((d,i)=>setCar(i,d));
$('timer').textContent=displayTime(elapsed);$('lap').textContent=(Math.min(2,1+Math.floor(Math.min(data[0].lap,data[1].lap))))+' / 2';

for(let i=0;i<2;i++){$(i?'redLap':'blueLap').textContent='Vuelta '+(data[i].lap+1);$(i?'redTime':'blueTime').textContent=elapsed>=T[i][1]?T[i][1].toFixed(3)+' s · META':(elapsed>=T[i][0]? 'V1 '+T[i][0].toFixed(3)+' s':'EN PISTA')}
$('scrub').value=Math.round(1000*elapsed/maxTime);
$('done').style.display=elapsed>=maxTime?'block':'none';if(elapsed>=maxTime){const winner=T[0][1]===T[1][1]?'EMPATE':T[0][1]<T[1][1]?'GANA AZUL':'GANA ROJO';$('winner').textContent=winner;$('finishDetail').textContent='Diferencia: '+Math.abs(T[0][1]-T[1][1]).toFixed(3)+' s';playing=false}
$('play').textContent=playing?'Ⅱ Pausar':'▶ Reproducir'}
// Perspectiva más cercana y controles libres de cámara: botón derecho para orbitar, rueda para zoom.
const orbitTarget=new THREE.Vector3(535,10,-300);
let orbitRadius=690,orbitAzimuth=.58,orbitPolar=.76,orbitDragging=false,lastMouseX=0,lastMouseY=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{if(e.button!==2||cameraMode!=='overview')return;orbitDragging=true;lastMouseX=e.clientX;lastMouseY=e.clientY;canvas.setPointerCapture(e.pointerId);e.preventDefault();});
canvas.addEventListener('pointermove',e=>{if(!orbitDragging)return;orbitAzimuth-=(e.clientX-lastMouseX)*.006;orbitPolar=clamp(orbitPolar+(e.clientY-lastMouseY)*.005,.18,1.48);lastMouseX=e.clientX;lastMouseY=e.clientY;});
const endOrbit=e=>{if(e.button===2||e.type==='pointercancel'){orbitDragging=false;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}};
canvas.addEventListener('pointerup',endOrbit);canvas.addEventListener('pointercancel',endOrbit);
canvas.addEventListener('wheel',e=>{if(cameraMode!=='overview')return;e.preventDefault();orbitRadius=clamp(orbitRadius*Math.exp(e.deltaY*.0011),150,1900)},{passive:false});
function cameras(dt){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();camera.up.set(0,1,0);
 if(cameraMode==='top'){camera.position.lerp(new THREE.Vector3(535,1250,-300),Math.min(1,dt*3));camera.lookAt(535,0,-300)}
 else if(cameraMode==='overview'){
 const sn=Math.sin(orbitPolar),desired=new THREE.Vector3(orbitTarget.x+orbitRadius*sn*Math.sin(orbitAzimuth),orbitTarget.y+orbitRadius*Math.cos(orbitPolar),orbitTarget.z+orbitRadius*sn*Math.cos(orbitAzimuth));
 camera.position.lerp(desired,Math.min(1,dt*5));camera.lookAt(orbitTarget);
 }else{
 const n=cameraMode==='blue'?0:1,p=cars[n].position;
 const target=new THREE.Vector3(p.x+75,p.y+90,p.z+100);
 camera.position.lerp(target,Math.min(1,dt*3));camera.lookAt(p.x,p.y,p.z);
 }
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-previous)/1000);previous=now;if(playing)elapsed+=dt*speed;update();cameras(dt);renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
$('play').onclick=()=>{if(elapsed>=maxTime)elapsed=0;playing=!playing};
$('restart').onclick=()=>{elapsed=0;playing=false;update()};
$('speed').onchange=e=>speed=Number(e.target.value);
$('scrub').oninput=e=>{elapsed=Number(e.target.value)/1000*maxTime;playing=false;update()};
for(const id of ['b1','bt','r1','rt'])$(id).onchange=()=>{elapsed=0;playing=false;update()};
document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{cameraMode=b.dataset.camera;document.querySelectorAll('[data-camera]').forEach(x=>x.classList.toggle('active',x===b))});
update();requestAnimationFrame(frame);
</script></body></html>
